media:
  # By default store media files in MEDIA folder next to the app (override with MEDIA_PATH)
  path: ${MEDIA_PATH:${user.dir}/MEDIA}
  public-url-prefix: ${MEDIA_PUBLIC_PREFIX:/media}

server:
  address: 0.0.0.0
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/blogDB}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:190485}
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET:bXktc3VwZXItc2VjcmV0LWtleS1mb3Itand0LXRva2Vucw==}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
